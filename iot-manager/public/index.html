<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IoT Manager Dashboard</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>IoT Manager Dashboard</h1>
        </header>
        
        <main>
            <section class="sensors-grid">
                <h2>Sensori Attivi</h2>
                <div id="sensors-container" class="grid">
                    <!-- I sensori verranno inseriti qui dinamicamente -->
                </div>
            </section>

            <section class="sensor-details">
                <h2>Dettagli Sensore</h2>
                <div id="sensor-details-container">
                    <div class="chart-container">
                        <canvas id="sensor-chart"></canvas>
                    </div>
                    <div class="sensor-info">
                        <h3 id="selected-sensor-name">Seleziona un sensore</h3>
                        <div id="sensor-data">
                            <!-- I dati del sensore verranno inseriti qui -->
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="app.js"></script>
</body>
</html>
